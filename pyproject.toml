[project]
name = "gameboy-mcp-player"
version = "1.1.0"
description = "MCP server that lets AI agents play any Game Boy game (with a rich Pokémon Gen 1 profile) and benchmarks them"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyboy>=2.6.0",
    "mcp>=1.10.0",
    "pillow>=10.0.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:sdl2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
